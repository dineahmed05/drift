name: update-videos
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-videos
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build library
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          YT_KEY2: ${{ secrets.YT_KEY2 }}
          YT_KEY3: ${{ secrets.YT_KEY3 }}
        run: python tools/gen_videos.py
      - name: Commit
        run: |
          git config user.name "drift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update library"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Publish site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy static content to Pages" --ref main || true
