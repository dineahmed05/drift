name: update-videos
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build library
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          YT_KEY2: ${{ secrets.YT_KEY2 }}
          YT_KEY3: ${{ secrets.YT_KEY3 }}
        run: python tools/gen_videos.py
      - name: Commit
        run: |
          git config user.name "drift-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A v series.tsv data
          git diff --cached --quiet || git commit -m "update library"
          git push
