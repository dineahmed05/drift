<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Drift player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#c{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}</style><style id="sty"></style></head>
<body><div id="c"><div id="clip"><div id="p"></div></div></div>
<script>
var D=window.D||{ready:function(){},buffered:function(){},started:function(){},ended:function(){},failed:function(){}};
var Q=new URLSearchParams(location.search);
var ID=Q.get('v')||'',NS=Q.get('ns')==='1',VERT=Q.get('vert')==='1',W0=+Q.get('w')||360,H0=+Q.get('h')||640,NC=Q.get('nc')==='1',DUR=+Q.get('dur')||0,endT=0;
var pl,want=false,es=false,rdy=false;
function lay(){var d=document.documentElement,W=d.clientWidth||window.innerWidth||W0,H=d.clientHeight||window.innerHeight||H0;
var nw=VERT?720:1280,nh=VERT?1280:720,s;
if(VERT){s=(W>H)?H/nh:Math.min(Math.max(W/nw,H/nh),1.25*W/nw);}else{s=(W>H)?Math.min(W/nw,H/nh):W/nw;}
var e=85/s;
document.getElementById('sty').innerHTML='#clip{position:absolute;left:'+(W/2-nw/2)+'px;top:'+(H/2-nh/2)+'px;width:'+nw+'px;height:'+nh+'px;overflow:hidden;transform:scale('+s+');transform-origin:50% 50%}#p{position:absolute!important;left:0;top:'+(-e)+'px;width:'+nw+'px!important;height:'+(nh+2*e)+'px!important;border:0}';}
setTimeout(function(){if(!rdy)D.failed('timeout');},7000);lay();window.onresize=lay;window.onload=lay;setTimeout(lay,400);setTimeout(lay,1500);
function sk(n){if(pl&&pl.seekTo&&pl.getCurrentTime){pl.seekTo(pl.getCurrentTime()+n,true);}}
function onYouTubeIframeAPIReady(){var o={width:'100%',height:'100%',videoId:ID,
playerVars:{autoplay:0,controls:0,playsinline:1,rel:0,modestbranding:1,fs:0,iv_load_policy:3,disablekb:1,mute:1},
events:{onReady:function(){rdy=true;D.ready();if(!want){pl.mute();pl.playVideo();}},
onStateChange:function(e){if(e.data==1){if(!want){pl.pauseVideo();pl.seekTo(0,true);D.buffered();}else{D.started();}}if(e.data==0)fe();},
onError:function(e){D.failed(''+e.data);}}};
if(NC)o.host='https://www.youtube-nocookie.com';
pl=new YT.Player('p',o);}
function fe(){if(es||!want||!pl||!pl.getDuration)return;var d=pl.getDuration(),t=pl.getCurrentTime();if(!(d>1&&t>=d-2.5)){endT=0;return;}if(DUR>0&&Math.abs(d-DUR)>Math.max(6,DUR*0.12)){if(!endT)endT=Date.now();if(Date.now()-endT<3000)return;}es=true;D.ended();}
function go(m,r){want=true;es=false;if(pl&&pl.playVideo){if(m)pl.mute();else pl.unMute();pl.setPlaybackRate(r);pl.seekTo(0,true);pl.playVideo();}}
function stp(){want=false;if(pl&&pl.pauseVideo)pl.pauseVideo();}
function pz(){if(pl&&pl.pauseVideo)pl.pauseVideo();}function rs(){if(pl&&pl.playVideo)pl.playVideo();}
function aud(m,r){if(pl&&pl.mute){if(m)pl.mute();else pl.unMute();pl.setPlaybackRate(r);}}
var stuck=0;setInterval(function(){if(want&&pl&&pl.getPlayerState){var s=pl.getPlayerState(),t=pl.getCurrentTime();
if(t>=0.4){stuck=0;}else if(s==1){stuck++;}else if(s==3||s==-1||s==5){stuck+=0.5;}else{stuck=0;}if(stuck>=5&&!NS){stuck=-99;D.failed('stuck');}}else{stuck=0;}},1000);
setInterval(function(){if(want&&pl&&pl.getDuration&&pl.getPlayerState){var s=pl.getPlayerState(),d=pl.getDuration(),t=pl.getCurrentTime();
if((s==0)||(s==1&&d>1&&t>=d-0.45))fe();}},300);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
